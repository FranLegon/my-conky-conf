conky.text = [[
${color #0080FF}SYSTEM ${hr 3}${color}
${color #43a1ff}Host:${color}${alignR}$nodename
${color #43a1ff}Uptime:${color}${alignR}$uptime

${color #0080FF}CPU ${hr 3}${color}
${color #43a1ff}Total Usage:${color}${alignR}${cpu}%
${color #43a1ff}${cpubar 6}${color}
${color #43a1ff}${cpugraph 30,380 0080FF 00FFFF}${color}

${color #0080FF}MEMORY ${hr 3}${color}
${color #43a1ff}RAM:${color}${alignR}$mem / $memmax ($memperc%)
${color #A0A0A0}${alignr}${lua_parse get_mem_decimal}${color}
${color #43a1ff}${membar 6}${color}
${color #43a1ff}Swap:${color}${alignR}$swap / $swapmax ($swapperc%)
${color #A0A0A0}${alignr}${lua_parse get_swap_decimal}${color}
${color #43a1ff}${swapbar 6}${color}

${color #0080FF}STORAGE ${hr 3}${color}
${color #43a1ff}Root (/):${color}${alignR}${fs_used /} / ${fs_size /} (${fs_used_perc /}%)
${color #A0A0A0}${alignr}${lua_parse get_fs_decimal /}${color}
${color #43a1ff}${fs_bar 6 /}${color}
${color #43a1ff}Read:${color}${alignR}${diskio_read}
${color #A0A0A0}${alignr}${lua_parse get_diskio_read_decimal}${color}
${color #43a1ff}${diskiograph_read 25,380 0080FF 00FFFF}${color}
${color #43a1ff}Write:${color}${alignR}${diskio_write}
${color #A0A0A0}${alignr}${lua_parse get_diskio_write_decimal}${color}
${color #43a1ff}${diskiograph_write 25,380 0080FF 00FFFF}${color}

${color #0080FF}NETWORK ${hr 3}${color}
${color #43a1ff}IP Address:${color}${alignR}${addr wlp6s0}
${color #43a1ff}${goto 110}Current${goto 205}Max${goto 300}Total${color}
${color #43a1ff}Down:${color}${goto 110}${lua get_current_down wlp6s0}${goto 205}${lua get_max_down wlp6s0}${goto 300}${totaldown wlp6s0}
${color #A0A0A0}${goto 110}${lua_parse get_downspeed_decimal wlp6s0}${goto 205}${lua_parse get_max_down_decimal wlp6s0}${goto 300}${lua_parse get_totaldown_decimal wlp6s0}${color}
${color #43a1ff}${downspeedgraph wlp6s0 25,380 0080FF 00FFFF}${color}
${color #43a1ff}${goto 110}Current${goto 205}Max${goto 300}Total${color}
${color #43a1ff}Up:${color}${goto 110}${lua get_current_up wlp6s0}${goto 205}${lua get_max_up wlp6s0}${goto 300}${totalup wlp6s0}
${color #A0A0A0}${goto 110}${lua_parse get_upspeed_decimal wlp6s0}${goto 205}${lua_parse get_max_up_decimal wlp6s0}${goto 300}${lua_parse get_totalup_decimal wlp6s0}${color}
${color #43a1ff}${upspeedgraph wlp6s0 25,380 0080FF 00FFFF}${color}

]]